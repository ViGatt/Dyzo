<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Correio Dyzo</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            position: relative;
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #F9D6EA;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.5) 20px, rgba(255,255,255,0.5) 40px);
            text-align: center; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: start; 
            box-sizing: border-box;
            padding: 20px 0;
        }

        /* --- ESTILO PARA AS DECORAÇÕES ESPALHADAS (pelo JS) --- */
        .decoracao {
            position: absolute;
            font-size: 30px; 
            opacity: 0.6; 
            z-index: 10; 
            pointer-events: none; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
            transition: transform 0.5s ease-out;
        }
        
        /* --- GRUPO DA LOGO E CAIPIRINHAS --- */
        .grupo-logo {
            position: relative;
            width: 110px; 
            margin: 0 auto 10px auto; 
            display: flex;
            justify-content: center;
        }

        .logo-circulo {
            width: 110px; height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #b80606; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
            position: relative;
            z-index: 5; 
            background-color: white; 
        }

        .icone-caipira {
            position: absolute;
            width: 70px; 
            top: 25px; 
            z-index: 1; 
            transition: transform 0.3s ease;
        }

        .icone-esq { left: -55px; transform: rotate(-20deg); }
        .icone-dir { right: -55px; transform: rotate(20deg); }

        .titulo-imagem {
            width: 90%;
            max-width: 250px; 
            height: auto;
            display: block;
            margin: 0 auto 20px auto; 
        }
        
        /* --- O BOX PRINCIPAL COM TEXTURA DE LINHO --- */
        #box { 
            background-color: #fff8e1;
            background-image: linear-gradient(90deg, rgba(140, 3, 3, 0.03) 1px, transparent 1px),
                              linear-gradient(rgba(140, 3, 3, 0.03) 1px, transparent 1px);
            background-size: 10px 10px;
            padding: 20px; 
            border-radius: 15px; 
            width: 92%;
            max-width: 400px; 
            border: 4px dashed #DF4C52; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative; 
            z-index: 20;
            margin-bottom: 30px;
            overflow: hidden; /* Essencial para as bandeirinhas e retalhos não vazarem */
        }

        /* Mantém o conteúdo legível acima dos retalhos */
        #box > *:not(.retalho):not(#varal-bandeirinhas) {
            position: relative;
            z-index: 2;
        }

        /* --- VARAL DE BANDEIRINHAS NO TOPO --- */
        #varal-bandeirinhas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            display: flex;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        .bandeirinha-topo {
            flex: 1;
            height: 100%;
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            filter: brightness(0.95); 
        }

        /* --- RETALHOS DE FUNDO DO BOX --- */
        .retalho {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            border: 1.8px dashed rgba(255, 255, 255, 0.85); 
            filter: drop-shadow(2px 3px 3px rgba(0, 0, 0, 0.15));
            border-radius: 4px;
            opacity: 0.38; 
            animation: balancarRetalho 6s ease-in-out infinite alternate;
        }

        .textura-xadrez {
            background-image: linear-gradient(90deg, rgba(0, 0, 0, 0.12) 50%, transparent 50%),
                              linear-gradient(rgba(0, 0, 0, 0.12) 50%, transparent 50%);
            background-size: 16px 16px;
        }

        .textura-listrada {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.25) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0.25) 75%, transparent 75%, transparent);
            background-size: 12px 12px;
        }

        .textura-poa {
            background-image: radial-gradient(rgba(255, 255, 255, 0.4) 20%, transparent 21%);
            background-size: 12px 12px;
        }

        @keyframes balancarRetalho {
            0% { transform: translate(0, 0) rotate(var(--rot-inicial)); }
            100% { transform: translate(4px, -3px) rotate(calc(var(--rot-inicial) + 4deg)); }
        }
        
        h2 { color: #DF4C52; font-size: 26px; margin-top: 5px; text-transform: uppercase;}
        .row { margin-bottom: 15px; text-align: left; color: #5d4037; font-weight: bold; }
        
        input, select { 
            width: 100%; padding: 12px; margin-top: 5px; 
            border-radius: 8px; border: 3px solid #ff2525; 
            background: #fff; box-sizing: border-box; font-size: 16px;
        }
        
        button#btn { 
            background: #DF4C52; color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 0 #b33e42;
            margin-bottom: 10px;
        }
        
        button:active, .btn-insta:active { 
            transform: translateY(4px); box-shadow: none; 
        }

        .btn-insta {
            display: block;
            background: linear-gradient(45deg, #DF4C52, #FBCEE5, #dc2743, #cc2366, #bc1888);
            color: white;
            text-decoration: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 0 #9b1470;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        #res { margin-top: 20px; font-weight: bold; color: #9C1D26; }

        /* --- POP-UP OVERLAY --- */
        #pop {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px); 
            align-items: center; 
            justify-content: center;
            z-index: 9999; 
        }

        /* --- O ENVELOPE EXTERNO (Borda Colorida) --- */
        .crt {
            /* Borda estilo correio aéreo com a paleta da Dyzo */
            background: repeating-linear-gradient(
                -45deg,
                #DF4C52,
                #DF4C52 15px,
                #fff 15px,
                #fff 30px,
                #F272C5 30px,
                #F272C5 45px,
                #fff 45px,
                #fff 60px
            );
            padding: 12px; /* Espessura da borda do envelope */
            width: 90%; 
            max-width: 360px;
            border-radius: 12px;
            box-shadow: 5px 15px 35px rgba(0,0,0,0.5);
            transform: rotate(-1deg); 
            position: relative;
            text-align: center;
            box-sizing: border-box; 
        }

        /* --- O PAPEL INTERNO (Onde o texto fica) --- */
        .papel-carta {
            background-color: #fff8e1; /* Fundo creme */
            /* Efeito de linhas de caderno vermelho bem clarinho */
            background-image: repeating-linear-gradient(transparent, transparent 28px, rgba(223, 76, 82, 0.15) 28px, rgba(223, 76, 82, 0.15) 30px);
            padding: 40px 20px 20px 20px;
            border-radius: 6px;
            border: 2px dashed #DF4C52;
            position: relative;
        }

        /* --- DETALHE DO SELO --- */
        .selo {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 35px;
            transform: rotate(15deg);
            opacity: 0.9;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.2));
            pointer-events: none;
        }

        /* Ajuste no botão "X" para ficar circular e saltado para fora do envelope */
        .x {
            position: absolute; 
            top: -12px; right: -12px; 
            cursor: pointer; font-size: 18px; font-weight: bold; color: white;
            background: #d81515;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .tit { color: #d81515; font-size: 20px; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; background: #fff8e1; display: inline-block; padding: 0 10px;}

        #msg {
            font-family: 'Courier New', Courier, monospace; 
            font-size: 20px; color: #4e342e; font-weight: bold;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .area-botoes-pop {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-pop {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 15px;
        }

        .btn-fechar-pop { background-color: #ddd; color: #333; }
        .btn-baixar-pop { background-color: #DF4C52; color: white; box-shadow: 0 3px 0 #b33e42; }

    </style>
</head>
<body>

    <div id="box">
        <div id="varal-bandeirinhas"></div>

        <div class="logo-container">
            <div class="grupo-logo">
                <img src="homem.png" class="icone-caipira icone-esq" alt="Caipira Menino">
                <img src="dyzo-logo.png" class="logo-circulo" alt="Dyzo Logo">
                <img src="mulher.png" class="icone-caipira icone-dir" alt="Caipira Menina">
            </div>
        </div>
        
        <img src="texto_logo.png" class="titulo-imagem" alt="Dyzfarce Elegante">
        
        <div class="row">
            <label>De (Opcional):</label>
            <input type="text" id="de" placeholder="Seu nome ou deixe em branco">
        </div>

        <div class="row">
            <label>Para:</label>
            <input type="text" id="para" placeholder="Nome do alvo">
        </div>

        <div class="row">
            <label>Estilo da Cantada:</label>
            <select id="tom">
                <option value="fofo">Fofo 🥰</option>
                <option value="engracado">Engraçado 😂</option>
                <option value="caipira">Caipira 🤠</option>
                <option value="ousado">Ousado 😏</option>
            </select>
        </div>

        <button id="btn">Enviar Correio</button>

        <a href="https://www.instagram.com/festadyzo?igsh=ejJ5ZG1sN3cwNTF1" target="_blank" class="btn-insta">
            📸 Visite a @festadyzo
        </a>
        
        <p id="res"></p>
    </div>

    <div id="pop">
        <div class="crt" id="cartinha-download">
            <span class="x" id="fechar">✖</span>
            
            <div class="papel-carta">
                <div class="selo">💘</div>
                <h3 class="tit">💌 Correio Elegante</h3>
                <div id="msg"></div>
                
                <div class="area-botoes-pop">
                    <button class="btn-pop btn-fechar-pop" id="fechar-btn-pop">Fechar</button>
                    <button class="btn-pop btn-baixar-pop" id="baixar">Baixar Cartinha 📸</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FUNÇÃO RESPONSIVA EMOJIS LATERAIS ---
        function espalharDecoracoes() {
            const decoracoes = ["🔥", "🌽", "🍿", "🎏", "🪁"]; 
            const numDecoracoes = 24; 
            
            const larguraTela = window.innerWidth;
            const larguraBox = larguraTela > 450 ? 400 : larguraTela * 0.92;
            const calhaLado = (larguraTela - larguraBox) / 2;

            for (let i = 0; i < numDecoracoes; i++) {
                const emoji = decoracoes[Math.floor(Math.random() * decoracoes.length)];
                const decorElement = document.createElement("span");
                decorElement.classList.add("decoracao");
                decorElement.innerText = emoji;

                let top = 5 + Math.random() * 90; 
                let left;

                if (i % 2 === 0) {
                    left = Math.random() * (calhaLado + (larguraTela > 450 ? -30 : 5));
                } else {
                    const inicioDireita = larguraTela - calhaLado - (larguraTela > 450 ? 0 : 15);
                    left = inicioDireita + Math.random() * (calhaLado - 15);
                }

                decorElement.style.top = top + "%";
                decorElement.style.left = Math.max(0, left) + "px";

                const size = larguraTela > 450 ? (25 + Math.random() * 20) : (16 + Math.random() * 10); 
                const rot = (Math.random() - 0.5) * 60; 
                
                decorElement.style.fontSize = size + "px";
                decorElement.style.transform = `rotate(${rot}deg) scale(0)`; 

                document.body.appendChild(decorElement);

                setTimeout(() => {
                    decorElement.style.transform = `rotate(${rot}deg) scale(1)`;
                }, 10 + i * 20); 
            }
        }

        // --- 2. FUNÇÃO BANDEIRINHAS (RESTORED) ---
        function gerarBandeirinhasTopo() {
            const varal = document.getElementById("varal-bandeirinhas");
            if (!varal) return;

            varal.innerHTML = '';
            const paleta = ["#F20C0C", "#8C0303", "#F272C5", "#D989A6", "#F24B6A"];
            
            const larguraBox = varal.offsetWidth;
            const larguraBandeirinha = 32; 
            const totalBandeirinhas = Math.ceil(larguraBox / larguraBandeirinha);

            for (let i = 0; i < totalBandeirinhas; i++) {
                const bandeirinha = document.createElement("div");
                bandeirinha.classList.add("bandeirinha-topo");
                const cor = paleta[i % paleta.length];
                bandeirinha.style.backgroundColor = cor;
                varal.appendChild(bandeirinha);
            }
        }

        // --- 3. FUNÇÃO RETALHOS DE FUNDO (RESTORED) ---
        function espalharRetalhos() {
            const box = document.getElementById("box");
            if (!box) return;

            const paleta = ["#F20C0C", "#8C0303", "#F272C5", "#D989A6", "#F24B6A"];
            const texturas = ["textura-solid", "textura-xadrez", "textura-listrada", "textura-poa"];
            const qteRetalhos = 24; 

            for (let i = 0; i < qteRetalhos; i++) {
                const retalho = document.createElement("div");
                retalho.classList.add("retalho");

                const cor = paleta[Math.floor(Math.random() * paleta.length)];
                const textura = texturas[Math.floor(Math.random() * texturas.length)];
                
                retalho.style.backgroundColor = cor;
                if (textura !== "textura-solid") {
                    retalho.classList.add(textura);
                }

                const largura = 45 + Math.random() * 40;
                const altura = 45 + Math.random() * 40;
                retalho.style.width = largura + "px";
                retalho.style.height = altura + "px";

                retalho.style.top = (5 + Math.random() * 85) + "%";
                retalho.style.left = (5 + Math.random() * 85) + "%";

                const rotacao = (Math.random() - 0.5) * 45; 
                retalho.style.setProperty('--rot-inicial', rotacao + 'deg');
                retalho.style.animationDelay = (Math.random() * -5) + "s"; 

                box.appendChild(retalho);
            }
        }

        // --- INICIALIZAÇÃO GERAL ---
        window.addEventListener('load', () => {
            espalharDecoracoes();
            espalharRetalhos();
            gerarBandeirinhasTopo();
        });

        // Atualiza as bandeirinhas caso a pessoa vire o celular
        window.addEventListener('resize', gerarBandeirinhasTopo);

        // --- LÓGICA DO CORREIO ELEGANTE ---
        const pop = document.getElementById('pop');
        const fecharModal = () => { pop.style.display = 'none'; };

        document.getElementById('fechar').onclick = fecharModal;
        document.getElementById('fechar-btn-pop').onclick = fecharModal;

        document.getElementById('btn').onclick = async function() {
            let de = document.getElementById('de').value || "Anônimo";
            let para = document.getElementById('para').value;
            let tom = document.getElementById('tom').value;
            
            if(!para) {
                alert("Opa, faltou dizer pra quem é sô!");
                return;
            }

            document.getElementById('res').innerText = "Escrevendo no capricho...";
            
            try {
                let resposta = await fetch('/api/correio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ de: de, para: para, tom: tom })
                });

                let dados = await resposta.json();
                
                if (dados.erro) {
                    throw new Error(dados.erro);
                }

                document.getElementById('res').innerText = ""; 
                document.getElementById('msg').innerHTML = `Para: <strong>${para}</strong><br>De: <strong>${de}</strong><br><br>${dados.mensagem}`;
                pop.style.display = 'flex';
                
            } catch (erro) {
                console.error(erro);
                document.getElementById('res').innerText = "Eita, deu problema na fogueira. Tente de novo!";
            }
        }

        // --- LÓGICA DE DOWNLOAD DA CARTINHA COMO IMAGEM ---
        document.getElementById('baixar').onclick = function() {
            const areaDownload = document.getElementById('cartinha-download');
            
            // Esconde a área de botões inteira (some com o buraco) e deixa o X invisível
            const botoesArea = areaDownload.querySelector('.area-botoes-pop');
            const botaoX = areaDownload.querySelector('.x');
            
            botoesArea.style.display = 'none'; 
            botaoX.style.opacity = '0'; 

            html2canvas(areaDownload, {
                backgroundColor: null, // Deixa o fundo atrás do envelope transparente
                scale: 2, 
                useCORS: true 
            }).then(canvas => {
                // Restaura os botões e o X pra pessoa poder fechar
                botoesArea.style.display = 'flex';
                botaoX.style.opacity = '1';

                const imgData = canvas.toDataURL("image/png");
                
                const link = document.createElement('a');
                link.href = imgData;
                link.download = `CorreioElegante_Festadyzo_${Date.now()}.png`; 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link); 
            });
        };

    </script>

</body>
</html>
